name: Release

on:
  push:
    tags: ["v*"]
    # TEMPORARY (ticket 02 dry run): the release workflow lives on a feature
    # branch before it reaches main, so the branch's own push exercises it.
    # Removed before the branch is merged.
    branches: ["ticket/02-release-workflow"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release instead of leaving it as a draft
        type: boolean
        default: false

permissions:
  contents: write

# A push that is replaced by a newer one has nothing left to release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Electron 44 requires Node >=22.12, and `node --test` expands the
          # test-file glob from Node 22 on.
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the core
        run: pip install -e ".[api]"

      - name: Test the core
        run: python -m unittest discover -s tests

      - name: Install the interface
        working-directory: web
        run: npm ci

      - name: Check the interface
        working-directory: web
        run: |
          npm run typecheck
          npm test
          npm run lint
          npm run build

      - name: Install the shell
        working-directory: desktop
        # No --ignore-scripts: packaging needs the Electron binary that the
        # install script downloads.
        run: npm ci

      - name: Test the shell
        working-directory: desktop
        run: npm test

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./desktop/package.json').version")"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::desktop/package.json version '$version' is not plain semver"
            exit 1
          fi

          # A tag release is the package version or it is not this release.
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match desktop/package.json (v$version)"
            exit 1
          fi

          # Tag pushes publish; a manual run publishes only when asked. The
          # temporary branch trigger never publishes.
          publish=false
          if [[ "$GITHUB_REF_TYPE" == "tag" || "${INPUT_PUBLISH:-false}" == "true" ]]; then
            publish=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version tag=v$version publish=$publish"

      - name: Build the installer
        run: node scripts/package.mjs

      - name: Check the installer exists
        shell: bash
        env:
          ASSET: build/installer/NoteAgent-${{ steps.version.outputs.version }}-x64.exe
        run: |
          set -euo pipefail
          if [[ ! -f "$ASSET" ]]; then
            echo "::error::expected the installer at $ASSET"
            exit 1
          fi
          ls -l "$ASSET"

      - name: Create or update the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: build/installer/NoteAgent-${{ steps.version.outputs.version }}-x64.exe
        run: |
          set -euo pipefail

          # Placeholder: ticket 04 replaces this with the matching CHANGELOG.md
          # section.
          body="$(printf '%s\n' \
            "## NoteAgent $VERSION" \
            "" \
            "Release notes will come from CHANGELOG.md (wired in ticket 04)." \
            "" \
            "Windows 可能提示未知发布者；请先退出 NoteAgent 再安装。")"

          # The by-tag endpoint hides drafts, so a draft has to be found by
          # listing releases. The oldest matching draft is updated; a published
          # release with the same tag is never touched.
          releases="$(gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq '.[] | [(.id|tostring), .tag_name, (.draft|tostring)] | @tsv')"

          release_id=""
          while IFS=$'\t' read -r id tag_name is_draft; do
            [[ -z "${id:-}" ]] && continue
            [[ "$tag_name" == "$TAG" ]] || continue
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::release $TAG already exists and is published; refusing to touch it"
              exit 1
            fi
            if [[ -z "$release_id" || "$id" -lt "$release_id" ]]; then
              release_id="$id"
            fi
          done <<< "$releases"

          if [[ -n "$release_id" ]]; then
            echo "Updating draft release $TAG ($release_id)"
            # The tag name is repeated here: editing a draft whose tag does
            # not exist yet otherwise rewrites it to an `untagged-` name.
            gh api --method PATCH "repos/$REPO/releases/$release_id" \
              -f tag_name="$TAG" \
              -f name="NoteAgent $VERSION" \
              -f body="$body" > /dev/null
          else
            echo "Creating draft release $TAG"
            release_id="$(gh api --method POST "repos/$REPO/releases" \
              -f tag_name="$TAG" \
              -f name="NoteAgent $VERSION" \
              -f body="$body" \
              -F draft=true \
              -F prerelease=false --jq '.id')"
          fi

          # Upload against the release id, not the tag: a tag lookup could
          # land on a different draft if more than one carries the tag.
          asset_name="$(basename "$ASSET")"
          existing_asset="$(gh api "repos/$REPO/releases/$release_id/assets?per_page=100" \
            --jq ".[] | select(.name == \"$asset_name\") | .id" | head -n 1)"
          if [[ -n "$existing_asset" ]]; then
            echo "Replacing existing asset $asset_name ($existing_asset)"
            gh api --method DELETE "repos/$REPO/releases/assets/$existing_asset" > /dev/null
          fi

          upload_url="$(gh api "repos/$REPO/releases/$release_id" \
            --jq '.upload_url' | sed 's/{.*//')"
          echo "Uploading $ASSET to $TAG ($release_id)"
          gh api --method POST \
            -H "Content-Type: application/octet-stream" \
            --input "$ASSET" \
            "$upload_url?name=$asset_name" > /dev/null

          count="$(gh api "repos/$REPO/releases/$release_id/assets?per_page=100" \
            --jq "[.[] | select(.name == \"$asset_name\")] | length")"
          if [[ "$count" != "1" ]]; then
            echo "::error::asset $asset_name is not attached to release $release_id"
            exit 1
          fi

      - name: Publish the release
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
