name: propose-protocol
title: 提议协作而不是直接写
turns:
  - "把这两篇笔记整理成一个对比页。"
assertions:
  wait: proposed
  max_tool_rounds: 4
  no_error: true
judge:
  grounding:
    must:
      - "提议内容基于 seeded wiki 的两篇笔记"
    must_not:
      - "编造笔记里没有的内容"
  completeness:
    must:
      - "说明将整理成什么对比页"
      - "说明需要人进入作业后才开始写"
  uncertainty:
    must:
      - "不声称已经写入或完成编译"
