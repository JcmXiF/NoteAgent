name: cross-page-gap
title: 跨页综合与缺口
turns:
  - "KL 散度和交叉熵是什么关系？wiki 里有 JS 散度吗？"
assertions:
  tools_any: [wiki_read, search]
  wait: absent
  max_tool_rounds: 6
  no_error: true
judge:
  grounding:
    must:
      - "每个事实断言都能在 seeded wiki 中找到依据"
    must_not:
      - "编造 wiki 没有的公式或数字"
  completeness:
    must:
      - "说明交叉熵 = 熵 + KL 散度"
      - "明确回答 wiki 里有没有 JS 散度"
    must_not:
      - "假装 wiki 里有 JS 散度的资料"
  uncertainty:
    must:
      - "资料不足时明确说明缺什么"
