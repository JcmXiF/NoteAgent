version: v3.0
dimensions:
  - name: grounding
    weight: essential
    must:
      - "每个事实断言都能在 seeded wiki 中找到依据"
    must_not:
      - "编造 wiki 没有的公式、数字或事实"
  - name: completeness
    weight: essential
    must:
      - "覆盖问题的全部 expected points"
    must_not:
      - "遗漏 expected point"
  - name: uncertainty
    weight: important
    must:
      - "wiki 没有覆盖时明确说明缺什么"
    must_not:
      - "把猜测说成 wiki 覆盖的事实"
veto:
  name: hallucination
  must:
    - "答案中的每个事实都能溯源"
  must_not:
    - "出现编造的事实"
