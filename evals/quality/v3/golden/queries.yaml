# Golden queries v2 — 20 single-turn evaluation questions.
# Schema: id, type, difficulty, question, corpus_pages, reference_answer,
# key_points, expected_trace, forbidden, raw_sources, notes.
# The judge sees key_points, not reference_answer.

- id: fact-easy-01
  type: fact
  difficulty: easy
  question: "信息熵的定义式是什么？它的单位由什么决定？"
  corpus_pages: [concepts/信息熵]
  reference_answer: |
    信息熵衡量信源或随机变量的不确定性，也等于平均自信息量。离散情形下
    H(X) = -Σ_i p_i log_b p_i；概率为零的项按 0 处理。对数底决定单位：
    b=2 为 bit，b=e 为 nat，b=10 为 Hart。
  key_points:
    - "熵衡量信源或随机变量的不确定性/平均信息量"
    - "H(X) = -Σ_i p_i log_b p_i"
    - "单位由对数底决定：b=2 bit、b=e nat、b=10 Hart"
    - "p_i=0 的项按 0 处理"
  expected_trace:
    tools_any: [search, wiki_read]
    wait: absent
    max_tool_rounds: 4
    no_error: true
  forbidden:
    - "编造 wiki 没有的熵公式或单位"
    - "声称已写入或编译完成"
  raw_sources: []
  notes: "单页定义题；以信息熵页的‘定义式/单位’两节为准。"

- id: fact-medium-01
  type: fact
  difficulty: medium
  question: "联合熵的定义式是什么？它对多个变量怎么推广？"
  corpus_pages: [concepts/联合熵]
  reference_answer: |
    联合熵衡量一组随机变量的共同不确定性。两个变量时
    H(X,Y) = -Σ_xΣ_y P(x,y) log_2 P(x,y)；多个变量时把求和推广到
    X_1..X_n 的联合分布。P(x,y)=0 的项按 0 处理。
  key_points:
    - "联合熵衡量一组变量的共同不确定性"
    - "H(X,Y) = -ΣΣ P(x,y) log_2 P(x,y)"
    - "多变量推广为联合分布 P(x_1,...,x_n) 的求和"
    - "零概率项按 0 处理"
  expected_trace:
    tools_any: [search, wiki_read]
    wait: absent
    max_tool_rounds: 4
    no_error: true
  forbidden:
    - "编造 wiki 没有的联合熵公式"
    - "把联合熵说成单个变量的熵"
  raw_sources: []
  notes: "单页定义题；联合熵页。"

- id: fact-medium-02
  type: fact
  difficulty: medium
  question: "条件熵 H(Y|X) 的定义是什么？它和联合熵、熵的关系是什么？"
  corpus_pages: [concepts/条件熵, concepts/联合熵, concepts/信息熵]
  reference_answer: |
    条件熵是给定 X 后 Y 剩余的不确定性，等于各条件熵 H(Y|X=x) 按 p(x)
    的期望：H(Y|X) = Σ_x p(x) H(Y|X=x)。它满足
    H(Y|X) = H(X,Y) - H(X)。当且仅当 Y 由 X 完全确定时 H(Y|X)=0；
    X、Y 独立时 H(Y|X)=H(Y)。
  key_points:
    - "条件熵是给定 X 后 Y 剩余的不确定性"
    - "H(Y|X) = Σ_x p(x) H(Y|X=x)"
    - "H(Y|X) = H(X,Y) - H(X)"
    - "Y 由 X 确定时为 0；独立时等于 H(Y)"
  expected_trace:
    tools_any: [search, wiki_read]
    wait: absent
    max_tool_rounds: 6
    no_error: true
  forbidden:
    - "把条件熵说成某个具体 x 下的熵"
    - "编造 wiki 没有的关系式"
  raw_sources: []
  notes: "两页关系题；条件熵页的链式关系与边界性质。"

- id: fact-hard-01
  type: fact
  difficulty: hard
  question: "KL 散度 D(p||q) 的离散定义是什么？它为什么不是距离？"
  corpus_pages: [concepts/KL散度]
  reference_answer: |
    KL 散度衡量用分布 Q 编码或近似分布 P 的额外代价，离散定义为
    D(p||q) = Σ_i p(x_i) log(p(x_i)/q(x_i))。它非负（由 Gibbs 不等式），
    且当且仅当 p 与 q 逐分量相等时为 0；但它不对称，
    D(p||q) ≠ D(q||p)，所以不是距离。JS 散度才是对称的。
  key_points:
    - "D(p||q)=Σ_i p(x_i) log(p(x_i)/q(x_i))"
    - "衡量用 Q 编码/近似 P 的额外代价"
    - "非负，且仅在 p=q 逐分量相等时为 0"
    - "不对称，不是距离；JS 散度是对称的"
  expected_trace:
    tools_any: [search, wiki_read]
    wait: absent
    max_tool_rounds: 6
    no_error: true
  forbidden:
    - "把 KL 散度说成对称距离或度量"
    - "编造 wiki 没有的性质或公式"
  raw_sources: []
  notes: "单页性质题；KL 页的定义、正定性、不对称性三节。"

- id: fact-hard-02
  type: fact
  difficulty: hard
  question: "互信息的定义是什么？它和 KL 散度、熵是什么关系？"
  corpus_pages: [concepts/互信息, concepts/KL散度, concepts/信息熵]
  reference_answer: |
    互信息度量两个变量相互依赖的程度：
    I(X;Y) = Σ_{x,y} p(x,y) log(p(x,y)/(p_X(x)p_Y(y)))。它等于联合分布
    与边缘分布乘积之间的 KL 散度：I(X;Y)=D_KL(p(x,y)||p_X p_Y)。
    X、Y 独立时 I=0；互信息非负且对称。直观上，它是知道一个变量后
    另一个变量不确定性的减少量。
  key_points:
    - "I(X;Y)=ΣΣ p(x,y) log(p(x,y)/(p_X p_Y))"
    - "I(X;Y)=D_KL(p(x,y)||p_X p_Y)"
    - "独立时为 0；非负且对称"
    - "衡量知道一方后另一方不确定性的减少"
  expected_trace:
    tools_any: [search, wiki_read]
    wait: absent
    max_tool_rounds: 6
    no_error: true
  forbidden:
    - "把互信息说成不对称"
    - "编造 wiki 没有的互信息公式"
  raw_sources: []
  notes: "两页关系题；互信息页的 KL 定义与性质。"

- id: synthesis-easy-01
  type: synthesis
  difficulty: easy
  question: "熵、联合熵、条件熵之间的链式关系是什么？"
  corpus_pages: [concepts/信息熵, concepts/联合熵, concepts/条件熵]
  reference_answer: |
    联合熵可以拆成熵加条件熵：H(X,Y) = H(X) + H(Y|X)，等价地
    H(Y|X) = H(X,Y) - H(X)。直观上，联合的不确定性等于 X 自身的不确定性，
    加上已知 X 后 Y 剩下的不确定性。
  key_points:
    - "H(X,Y) = H(X) + H(Y|X)"
    - "H(Y|X) = H(X,Y) - H(X)"
    - "联合不确定性 = X 的熵 + 已知 X 后 Y 的条件熵"
  expected_trace:
    tools_any: [search, wiki_read]
    wait: absent
    max_tool_rounds: 6
    no_error: true
  forbidden:
    - "把链式关系写成 H(X,Y)=H(X)+H(Y)"
    - "编造 wiki 没有的恒等式"
  raw_sources: []
  notes: "两页链式关系；条件熵页的 H(Y|X)=H(X,Y)-H(X)。"

- id: synthesis-medium-01
  type: synthesis
  difficulty: medium
  question: "互信息和条件熵、熵的关系是什么？为什么说互信息是‘不确定性的减少’？"
  corpus_pages: [concepts/互信息, concepts/条件熵, concepts/信息熵]
  reference_answer: |
    互信息等于知道一个变量后另一个不确定性减少的量：
    I(X;Y) = H(X) - H(X|Y) = H(Y) - H(Y|X)。条件熵 H(X|Y) 是已知 Y 后
    X 剩下的不确定性，所以两者之差就是 Y 带来的信息增益。
  key_points:
    - "I(X;Y) = H(X) - H(X|Y)"
    - "I(X;Y) = H(Y) - H(Y|X)"
    - "互信息是知道一方后另一方不确定性的减少"
    - "条件熵是剩余的不确定性"
  expected_trace:
    tools_any: [search, wiki_read]
    wait: absent
    max_tool_rounds: 6
    no_error: true
  forbidden:
    - "把互信息写成 H(X|Y)-H(X) 这类反向关系"
    - "编造 wiki 没有的关系式"
  raw_sources: []
  notes: "信息增益的两种表述；互信息/条件熵。"

- id: synthesis-medium-02
  type: synthesis
  difficulty: medium
  question: "互信息和 KL 散度是什么关系？为什么独立时互信息为零？"
  corpus_pages: [concepts/互信息, concepts/KL散度]
  reference_answer: |
    互信息是联合分布 p(x,y) 与边缘分布乘积 p_X(x)p_Y(y) 之间的 KL 散度：
    I(X;Y)=D_KL(p(x,y)||p_X p_Y)。当 X、Y 独立时，联合分布等于边缘分布
    乘积，这个 KL 散度为 0，所以互信息为零。
  key_points:
    - "I(X;Y)=D_KL(p(x,y)||p_X p_Y)"
    - "比较的是联合分布与边缘分布乘积"
    - "独立时联合=乘积，KL=0，互信息=0"
    - "KL 非负，因此互信息非负"
  expected_trace:
    tools_any: [search, wiki_read]
    wait: absent
    max_tool_rounds: 6
    no_error: true
  forbidden:
    - "编造 KL 与互信息之间的错误等式"
    - "把独立时的互信息说成非零"
  raw_sources: []
  notes: "互信息的 KL 定义 + 独立性。"

- id: synthesis-hard-01
  type: synthesis
  difficulty: hard
  question: "把 H(X)、H(Y)、H(X,Y)、H(X|Y)、H(Y|X)、I(X;Y) 的关系用一张关系表或维恩图讲清楚。"
  corpus_pages: [concepts/信息熵, concepts/联合熵, concepts/条件熵, concepts/互信息]
  reference_answer: |
    可以把两变量的信息量看成维恩图：H(X,Y) 是两块的总和；I(X;Y) 是交集；
    H(X|Y) 是 X 中不与 Y 共享的部分，H(Y|X) 是 Y 中不与 X 共享的部分。
    关系：H(X,Y)=H(X)+H(Y)-I(X;Y)；
    I(X;Y)=H(X)-H(X|Y)=H(Y)-H(Y|X)；
    H(X|Y)=H(X,Y)-H(Y)。
  key_points:
    - "H(X,Y) = H(X) + H(Y) - I(X;Y)"
    - "I(X;Y) = H(X) - H(X|Y) = H(Y) - H(Y|X)"
    - "H(X|Y) = H(X,Y) - H(Y)"
    - "维恩图：交集是互信息，条件熵是不重叠部分"
  expected_trace:
    tools_any: [search, wiki_read]
    wait: absent
    max_tool_rounds: 6
    no_error: true
  forbidden:
    - "把 H(X|Y) 与 H(Y|X) 混为一谈"
    - "编造 wiki 没有的关系式"
  raw_sources: []
  notes: "四页关系；维恩图/关系表。"

- id: synthesis-hard-02
  type: synthesis
  difficulty: hard
  question: "条件熵里的‘信息增益’和互信息里的‘信息增益’是一回事吗？请说明两种用法。"
  corpus_pages: [concepts/条件熵, concepts/互信息, concepts/信息熵]
  reference_answer: |
    两者指向同一个量：用 Y 的信息去看 X 后不确定性减少的部分。条件熵页
    把它说成 H(X)-H(X|Y)（以及对 Y 的对称形式），互信息页把互信息也称作
    信息增益，并给出 I(X;Y)=H(X)-H(X|Y)=H(Y)-H(Y|X)。所以条件熵的
    ‘剩余不确定性’和互信息的‘减少量’是同一关系的两面；互信息对称，
    条件熵本身不对称。
  key_points:
    - "信息增益 = 不确定性减少量"
    - "I(X;Y)=H(X)-H(X|Y)=H(Y)-H(Y|X)"
    - "条件熵是剩余不确定性，互信息是减少量"
    - "互信息对称，条件熵本身不对称"
  expected_trace:
    tools_any: [search, wiki_read]
    wait: absent
    max_tool_rounds: 6
    no_error: true
  forbidden:
    - "把互信息说成只等于 H(X)-H(X|Y) 而不对称"
    - "把两个‘信息增益’说成完全无关的量"
  raw_sources: []
  notes: "信息增益术语的两种用法；互信息别名。"

